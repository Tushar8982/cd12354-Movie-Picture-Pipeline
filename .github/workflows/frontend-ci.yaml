name: Frontend Continuous Integration

on:
  pull_request:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend-ci.yaml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.14'
          cache: 'npm'
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: starter/frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: starter/frontend
        run: npm run lint

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.14'
          cache: 'npm'
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: starter/frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: starter/frontend
        env:
          CI: true
        run: npm test

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.14'
          cache: 'npm'
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: starter/frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: starter/frontend
        env:
          CI: true
        run: npm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build frontend Docker image
        working-directory: starter/frontend
        env:
          REACT_APP_MOVIE_API_URL: http://ae36e130190754011aa0c8b6148d3989-278548800.us-east-1.elb.amazonaws.com
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL=${REACT_APP_MOVIE_API_URL} \
            -t ${{ steps.login-ecr.outputs.registry }}/frontend:latest .

      - name: Push frontend Docker image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/frontend:latest